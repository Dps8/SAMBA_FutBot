project:
  name: SAMBA FutBot
  category: Profesional
  drive_root_id: 1TF7-P4rAwPmHFw_TjmNfFU3ORxqnp8CD

data:
  manifest: data/manifests/drive_index.json
  raw_dir: data/raw
  frame_dir: data/frames

sam3:
  # Stable baseline. Use facebook/sam3.1 for multiplex experiments.
  model_id: facebook/sam3
  backend: official
  max_frames: 450
  stride: 2
  threshold: 0.45
  mask_threshold: 0.5
  use_fa3: false
  offload_video_to_cpu: true
  offload_state_to_cpu: true
  prompts:
    field:
      - green soccer field
    robots:
      - robot
    ball:
      - soccer ball

tracking:
  iou_threshold: 0.25
  max_age: 12
  min_area:
    ball: 10
    robots: 40
    field: 1000

analysis:
  fps: 30
  possession_radius_px: 90
  collision_radius_px: 55
  goal_x_margin_ratio: 0.08

visualization:
  overlay_alpha: 0.45
  trail_length: 45
  output_fps: 30
