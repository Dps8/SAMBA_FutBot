project:
  name: SAMBA FutBot
  category: Profesional
  drive_root_id: 1TF7-P4rAwPmHFw_TjmNfFU3ORxqnp8CD

data:
  manifest: data/manifests/drive_index.json
  raw_dir: data/raw
  frame_dir: data/frames

sam3:
  # Stable baseline. Use facebook/sam3.1 for multiplex experiments.
  model_id: facebook/sam3
  backend: official
  max_frames: 300
  prompt_frame_index: 0
  stride: 2
  threshold: 0.45
  mask_threshold: 0.5
  max_prompts_per_class: 6
  use_fa3: false
  offload_video_to_cpu: true
  offload_state_to_cpu: true
  prompts:
    field:
      - green soccer field
      - green soccer pitch
      - green robotic soccer field
      - green indoor soccer field
    robots:
      - robot
    person:
      - person
      - person on soccer field
      - human on soccer field
      - person entering the field
    human:
      - human
      - human intervention
      - human near robot soccer field
    referee:
      - referee
      - referee on soccer field
    hand:
      - hand
      - human hand
      - hand near ball
      - hand on soccer field
    goal_blue:
      - blue goal
      - dark blue goal
      - dark blue and black goal
      - black and blue goal
      - blue box
      - dark blue box
      - dark blue and black box
      - black and blue box
      - blue table
      - dark blue table
      - blue board
      - dark blue board
      - black and blue board
      - blue color box
      - dark blue color box
      - black and blue color box
      - blue goal box
      - blue goal frame
      - blue goal post
      - blue rectangular goal
      - dark blue rectangular goal
      - navy blue rectangular goal
      - black and blue rectangular goal
      - blue structure on soccer field
      - dark blue structure on soccer field
      - black and blue structure on soccer field
      - blue boards
      - dark blue boards
      - black and blue boards
      - blue tables
      - dark blue tables
      - blue soccer goal
      - blue robot soccer goal
      - dark blue robot soccer goal
      - black and blue robot soccer goal
      - caja azul
      - caja azul oscuro
      - caja azul oscuro y negra
      - tabla azul
      - tabla azul oscura
      - tablas azules
      - tablas azul oscuro
      - porteria azul
      - porteria azul oscuro
      - porteria azul oscuro y negra
    goal_yellow:
      - yellow goal
      - yellow box
      - yellow table
      - yellow board
      - yellow color box
      - yellow goal box
      - yellow goal frame
      - yellow goal post
      - yellow rectangular goal
      - yellow structure on soccer field
      - yellow boards
      - yellow tables
      - yellow soccer goal
      - yellow robot soccer goal
      - caja amarilla
      - tabla amarilla
      - tablas amarillas
      - porteria amarilla
    ball:
      - small orange ball
      - small orange ball on green soccer field
      - small orange ball in robot possession
      - orange ball near robot
      - orange ball
      - pelota naranja sobre campo verde
      - pelota naranja

tracking:
  iou_threshold: 0.25
  max_age: 12
  min_area:
    ball: 10
    robots: 40
    field: 1000

team_detection:
  enabled: true
  max_color_distance: 170
  min_saturation: 45
  min_value: 40
  min_pixels: 8
  palette:
    blue: [55, 115, 220]
    yellow: [230, 210, 60]

human_detection:
  enabled: false
  classes: [person, human, referee, hand]

goal_detection:
  color_enabled: true
  adaptive_color: true
  adaptive_hsv_margin: [12, 45, 45]
  adaptive_min_pixels: 120
  spatial_gate_from_seeds: true
  seed_spatial_margin_px: 90
  require_seed_for_color: false
  require_field_overlap: true
  infer_missing_opposite: false
  inferred_goal_score: 0.28
  field_margin_px: 18
  min_area: 180
  max_area: 80000
  min_extent: 0.18
  max_per_frame_per_class: 1
  broad_profiles:
    goal_blue:
      hsv_lower: [80, 25, 15]
      hsv_upper: [145, 255, 255]
    goal_yellow:
      hsv_lower: [10, 35, 45]
      hsv_upper: [55, 255, 255]
  profiles:
    goal_blue:
      hsv_lower: [88, 45, 20]
      hsv_upper: [135, 255, 255]
    goal_yellow:
      hsv_lower: [18, 70, 80]
      hsv_upper: [42, 255, 255]

robot_filter:
  enabled: true
  max_per_frame: 2
  min_area: 350
  max_area_ratio: 0.08
  containment_threshold: 0.82
  iou_threshold: 0.55
  min_center_distance_px: 28

ball_detection:
  # The current rule ball is orange, but color is treated as a profile, not as
  # the only detector. Top-camera processing fuses SAM3 ball prompts with this
  # configurable color/shape cue before temporal refinement.
  sam3_enabled: true
  color_enabled: true
  default_profile: orange
  profiles:
    orange:
      hsv_lower: [0, 90, 90]
      hsv_upper: [25, 255, 255]
    white:
      hsv_lower: [0, 0, 160]
      hsv_upper: [180, 80, 255]
    yellow:
      hsv_lower: [20, 80, 90]
      hsv_upper: [38, 255, 255]

analysis:
  fps: 30
  possession_radius_px: 90
  in_play_field_margin_px: 8
  ball_border_margin_px: 4
  collision_radius_px: 55
  goal_x_margin_ratio: 0.08
  goal_confirmation:
    enabled: true
    lookback_frames: 8
    confirmation_frames: 4
    min_inside_frames: 2
    min_entry_motion_px: 3
    min_goal_score: 0.45

visualization:
  overlay_alpha: 0.45
  trail_length: 45
  output_fps: 30
